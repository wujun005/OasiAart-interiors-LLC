<div class="pr"><b>${f(b.price)}</b></div><div class="per"><s>${f(b.was)}</s> · ${esc(b.per)}</div><span class="sv">Save ${f(b.was-b.price)}</span><button class="vb" data-go="#p/${i}">View Package</button></div><div class="ph">${img(b)}</div></div>`).join('')}</div></section></div>`}
function bundles(){return `<div class="wrap"><div class="crumb"><a data-go="#home">Services</a> › <b>Bundles &amp; Combo Packages</b></div>
<section class="lh"><div><span class="pill">BUNDLE &amp; SAVE</span><h1>Bundle More, Save More.</h1><p>Combine the services your home needs and pay less than booking them separately — cleaning with AC care, painting with a deep clean, and repair packs across Dubai. One booking, one schedule, better value.</p>
<div class="tg"><span>🏷 Save More</span><span>📅 One Booking</span><span>✓ Trusted Across Dubai</span></div></div><div class="tk"><div class="a"><small>SAVE UP TO</small><b style="font-size:26px">AED 337.62</b></div><div class="c"><b>BUNDLE OFFER</b><small>Savings shown on<br>every package</small></div></div></section>
<div class="lt"><h2>Choose Service Type</h2><small>${B.length} bundles · prices excl. 5% VAT</small></div>
<div class="lg">${B.map((b,i)=>`<div class="lc" data-go="#p/${i}"><div class="ph">${img(b)}<span class="rib">Save ${f(b.was-b.price)}</span><span class="vis">${b.visits}</span></div><div class="bd"><h3>${esc(b.full)}</h3><p class="ln">${esc(b.tagline)}</p>
<div class="sf">STARTING FROM</div><div class="lp"><b>${f(b.price)}</b><s>${f(b.was)}</s></div><div class="lf"><span class="sv" style="margin:0">Save ${f(b.was-b.price)}</span><button class="bk">Book now →</button></div></div></div>`).join('')}</div></div>`}
let st={};
function product(i){const b=B[i];if(st.i!==i){const m=minP(b);st={i,furn:m.furn,size:m.size,th:0}}
const furns=[...new Set(b.opts.map(o=>o.furn))].filter(Boolean);
const list=b.opts.filter(o=>!b.hasFurn||o.furn===st.furn);let sel=list.find(o=>o.size===st.size)||list[0];st.size=sel.size;
const save=sel.w-sel.p,vat=sel.p*0.05;
const thumbs=[b,...B.filter(x=>x!==b).slice(0,4)];
return `<div class="wrap"><div class="crumb"><a data-go="#home">Services</a> › <a data-go="#bundles">Bundles &amp; Combo Packages</a> › <b>${esc(b.full)}</b></div>
<div class="pg"><div class="th">${thumbs.map((t,k)=>`<div class="${k===st.th?'on':''}" data-th="${k}">${img(t)}</div>`).join('')}</div>
<div><div class="main">${img(thumbs[st.th])}<span class="mp">★ ${b.badge==='MOST POPULAR'?'Most Popular':b.badge.charAt(0)+b.badge.slice(1).toLowerCase()}</span><div class="bo"><span>SAVE</span><b>${f(sel.w-sel.p)}</b><i>BUNDLE<br>OFFER<small>${esc(b.visits)}</small></i></div></div>
<div class="trust"><div>Vetted professionals</div><div>Flexible booking</div><div>Clear pricing</div><div>${b.trust}</div></div>
<div class="how"><small>HOW THE BUNDLE WORKS</small><h3>${b.how}</h3><p><b>${esc(b.tagline)}.</b> ${esc(b.desc)}</p>
<div class="vg">${b.visits_list.map(v=>`<div class="${v[2]?'on':''}"><b>${v[0]}</b>${esc(v[1])}</div>`).join('')}</div>
<div class="det"><h4>What this service includes</h4><ul>${b.inc.map(x=>{const k=x.indexOf(':');return `<li>${k>0?`<b>${esc(x.slice(0,k))}:</b>${esc(x.slice(k+1))}`:esc(x)}</li>`}).join('')}</ul>
<h4>Booking notes</h4><ul>${b.notes.map(x=>{const k=x.indexOf(':');return `<li>${k>0?`<b>${esc(x.slice(0,k))}:</b>${esc(x.slice(k+1))}`:esc(x)}</li>`}).join('')}</ul></div></div></div>
<aside class="side"><div class="sd"><div class="cat">BUNDLES &amp; COMBO PACKAGES</div><h1>${esc(b.full)}</h1><div class="ts"><b>🛡 Trusted service</b> · Dubai</div>
<div class="bp"><small>AED</small><b>${sel.p.toLocaleString('en-US',{minimumFractionDigits:2})}</b><s>${f(sel.w)}</s><em>Save ${f(save)}</em></div><div class="vat">Price excl. 5% VAT</div></div>
<div class="sd">${b.hasFurn?`<h4>Furnishing</h4><div class="fu">${furns.map(x=>`<button class="${x===st.furn?'on':''}" data-furn="${x}">${x}</button>`).join('')}</div>`:''}
<h4>${esc(b.sizeHead)}</h4><div class="hs">${esc(b.line)}</div><div class="og ${list.length===1?'one':''}">${list.map(o=>`<button class="${o===sel?'on':''}" data-size="${esc(o.size)}"><b>${esc(o.size)}</b><span>${esc(o.det)}</span><i>${f(o.p)}</i></button>`).join('')}</div></div>
<div class="sd os"><h4>Order summary</h4><div class="r"><span>Selected service<br><small style="color:var(--muted)">${esc(sel.size)}${sel.furn?' · '+sel.furn:''}</small></span><span><s>${f(sel.w)}</s><b>${f(sel.p)}</b></span></div>
<div class="r ys"><span>You save</span><span>${f(save)}</span></div><div class="r"><span>VAT (5%)</span><span>${f(vat)}</span></div>
<div class="tot"><b>Total</b><strong>${f(sel.p+vat)}</strong></div><button class="co">Confirm Order →</button><button class="ac">🛒 Add to Cart</button><div class="sec">🔒 Secure checkout · 📅 Pick dates before confirming</div></div></aside></div></div>`}
function render(){const h=location.hash||'#home';const app=document.getElementById('app');
if(h.startsWith('#p/'))app.innerHTML=product(+h.slice(3));else if(h==='#bundles')app.innerHTML=bundles();else app.innerHTML=home();
document.getElementById('n-home').className=h==='#home'?'on':'';document.getElementById('n-svc').className=h!=='#home'?'on':''}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');const t=e.target.closest('[data-tab]'),fu=e.target.closest('[data-furn]'),sz=e.target.closest('[data-size]'),th=e.target.closest('[data-th]');
if(t){tab=t.dataset.tab;render();return}if(fu){st.furn=fu.dataset.furn;render();return}if(sz){st.size=sz.dataset.size;render();return}if(th){st.th=+th.dataset.th;render();return}
if(g){e.preventDefault();const to=g.dataset.go;if(location.hash===to)render();else location.hash=to;window.scrollTo(0,g.dataset.sc?document.getElementById('fp')?.offsetTop||0:0)}});
window.addEventListener('hashchange',render);render();
</script></body></html>
